[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[dependency-groups]
dev = ["pytest>=7.0"]

[project]
authors = [
  { name = "rchardx" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.0",
]
description = "CLI tool to track and display OpenCode token usage statistics (v1 and v2)"
keywords = ["opencode", "cli", "tokens", "usage", "analytics", "sqlite"]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
  { name = "fcomovaz" },
]
name = "opencode-usage-v2"
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.4"

[project.scripts]
opencode-usage = "opencode_usage.cli:main"
opencode-usage-v2 = "opencode_usage.cli:main"

[project.urls]
Changelog = "https://github.com/fcomovaz/opencode-usage-v2-supp/blob/main/CHANGELOG.md"
Homepage = "https://github.com/fcomovaz/opencode-usage-v2-supp"
Issues = "https://github.com/fcomovaz/opencode-usage-v2-supp/issues"
Repository = "https://github.com/fcomovaz/opencode-usage-v2-supp"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B310", "B404", "B603", "B607", "B608"]

[tool.commitizen]
major_version_zero = true
name = "cz_conventional_commits"
tag_format = "$version"
update_changelog_on_bump = true
version_provider = "pep621"
version_scheme = "pep440"

[tool.hatch.build.targets.sdist]
exclude = [
  ".github/**",
  "AGENTS.md",
  "CHANGELOG.md",
  "PR_DESCRIPTION.md",
  "opencode-insights.html",
  "tests/**",
]
include = [
  "src/opencode_usage/**",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["opencode_usage"]
